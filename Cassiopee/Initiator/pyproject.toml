[build-system]
requires = ["scikit-build-core>=0.3.3", "numpy>=1.23.3"]
build-backend = "scikit_build_core.build"

[project]
name = "Initiator"
version = "4.2"
description = "Cassiopee Initiator module"
authors = [{name = "ONERA", email = "cassiopee@onera.fr"}]
requires-python = ">=3.8"
dependencies = ["numpy>=1.23.3"]

[tool.scikit-build]
# cmake.source-dir points to this module's CMakeLists.txt (default: ".")
cmake.build-type = "Release"
# CASSIOPEE_ROOT defaults to the parent directory (sibling modules must be
# present when building standalone).  Override with:
#   pip install --config-setting=cmake.args="-DCASSIOPEE_ROOT=/path/to/Cassiopee" .
cmake.args = []
